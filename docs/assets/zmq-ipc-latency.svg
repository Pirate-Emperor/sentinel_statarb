<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="430" viewBox="0 0 1100 430">
<rect width="1100" height="430" fill="#101827"/><g font-family="Arial,sans-serif"><text x="40" y="50" fill="#72d9be" font-size="15" font-weight="700">ZERO MQ / PROCESS-TO-PROCESS IPC</text><text x="40" y="91" fill="#f3f6fb" font-size="28" font-weight="700">Measured round-trip latency</text><text x="40" y="123" fill="#aab8ce" font-size="16">20,000 timed messages after 2,000 warm-up messages</text>
<text x="48" y="178" fill="#5a9bd8" font-size="16" font-weight="700">P50</text><rect x="160" y="150" width="140" height="40" rx="7" fill="#5a9bd8"/><text x="315" y="177" fill="#f3f6fb" font-size="18" font-weight="700">96.914 us</text>
<text x="48" y="253" fill="#df9c47" font-size="16" font-weight="700">P95</text><rect x="160" y="225" width="425" height="40" rx="7" fill="#df9c47"/><text x="600" y="252" fill="#f3f6fb" font-size="18" font-weight="700">294.409 us</text>
<text x="48" y="328" fill="#ca6a66" font-size="16" font-weight="700">P99</text><rect x="160" y="300" width="1010" height="40" rx="7" fill="#ca6a66"/><text x="830" y="327" fill="#101827" font-size="18" font-weight="700">700.425 us</text>
<rect x="40" y="370" width="1020" height="38" rx="8" fill="#282535" stroke="#5b506e"/><text x="60" y="394" fill="#d6b9ff" font-size="14">Round trip includes Python and OS scheduling; it is not one-way latency.</text></g></svg>