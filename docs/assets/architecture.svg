<g font-family="Arial,sans-serif" fill="#eaf0f8"><text x="68" y="391" fill="#72d9be" font-size="16" font-weight="700">ASYNC STORAGE</text><text x="68" y="430" font-size="23" font-weight="700">DuckDB batch writer</text><text x="68" y="465" fill="#b8c5d8" font-size="15">Bounded queue applies back-pressure, not silent drops.</text><text x="626" y="391" fill="#ffb36c" font-size="16" font-weight="700">REPEATABLE TESTS</text><text x="626" y="430" font-size="23" font-weight="700">Warm-up, then timed runs</text><text x="626" y="465" fill="#b8c5d8" font-size="15">Risk sweeps, queue checks, CSV / JSON reports and SVG charts.</text><text x="44" y="555" fill="#f6c778" font-size="15">ZeroMQ IPC is not a lock-free queue. Compare only like-for-like measurements.</text></g></svg>