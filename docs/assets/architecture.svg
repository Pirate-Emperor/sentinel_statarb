<text x="68" y="391" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72d9be">ASYNC STORAGE</text>
<text x="68" y="430" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#eaf0f8">DuckDB batch writer</text>
<text x="68" y="465" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#b8c5d8">Bounded queue adds back-pressure instead of silent drops.</text>
<text x="626" y="391" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#ffb36c">REPEATABLE TESTS</text>
<text x="626" y="430" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#eaf0f8">Warm-up, then timed runs</text>
<text x="626" y="465" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#b8c5d8">Risk sweeps, queue checks, CSV / JSON reports and SVG charts.</text>
<text x="44" y="555" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#f6c778">ZeroMQ IPC is not a lock-free queue. Compare only like-for-like measurements.</text>
