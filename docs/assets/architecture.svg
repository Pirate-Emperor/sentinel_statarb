<text x="44" y="99" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#f4f7fb">Quotes in, tested decisions out</text>
<text x="44" y="130" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#aab8ce">An in-process C++ queue and the Python / storage path have separate measurements.</text>
