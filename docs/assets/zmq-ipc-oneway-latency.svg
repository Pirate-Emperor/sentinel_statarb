<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
<rect width="1120" height="500" fill="#101827"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72d9be">NATIVE C++ / ZERO MQ IPC ONE-WAY LATENCY</text>
<text x="40" y="90" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f3f6fb">Measured result not recorded in this snapshot</text>
<text x="40" y="124" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#aab8ce">The CI job runs a native C++ PUSH/PULL test with a 2,000-message warm-up.</text>
<rect x="40" y="165" width="1040" height="130" rx="12" fill="#1a2638" stroke="#40536c" stroke-width="2"/>
<text x="68" y="208" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#dfaa4a">P50 / P95 / P99</text>
<text x="68" y="248" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#f3f6fb">Pending current-run measurements</text>
<text x="68" y="277" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#aab8ce">This image is replaced when the benchmark report is generated.</text>
<rect x="40" y="325" width="1040" height="82" rx="12" fill="#202c3d" stroke="#40536c" stroke-width="2"/>
<text x="64" y="361" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#72d9be">Target: p50 one-way latency below 10 μs</text>
<text x="64" y="389" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#c8d2e1">This target is reported as met only if the measured report confirms it.</text>
<text x="40" y="463" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#aab8ce">ZeroMQ itself is not described as lock-free; native SPSC atomics are measured separately.</text>
