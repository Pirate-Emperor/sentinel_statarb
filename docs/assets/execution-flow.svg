<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570">
<rect width="1200" height="570" fill="#f4f0e7"/><g font-family="Arial,sans-serif"><text x="44" y="52" fill="#17685c" font-size="16" font-weight="700">QUOTE HANDLING / EXECUTION TRACE</text><text x="44" y="96" fill="#1b2d33" font-size="29" font-weight="700">Protective checks do not wait for the signal gate</text>
<g fill="#fff" stroke="#247d75" stroke-width="2"><rect x="45" y="146" width="230" height="126" rx="12"/><rect x="340" y="146" width="230" height="126" rx="12"/><rect x="635" y="146" width="230" height="126" rx="12"/><rect x="930" y="146" width="225" height="126" rx="12"/></g>
<g fill="#247d75" font-size="16" font-weight="700"><text x="61" y="180">1. RECEIVE</text><text x="356" y="180">2. VALIDATE</text><text x="651" y="180">3. CHECK RISK</text><text x="946" y="180">4. SIGNAL</text></g>
<g fill="#23323a" font-size="17"><text x="61" y="218">Quote + sequence</text><text x="61" y="247">Bid and ask</text><text x="356" y="218">Fresh timestamp</text><text x="356" y="247">Reject repeats</text><text x="651" y="218">Stop + target</text><text x="651" y="247">Every valid quote</text><text x="946" y="218">Pass or debounce</text><text x="946" y="247">Strategy signal</text></g>
<g stroke="#506a73" stroke-width="3" fill="none"><path d="M277 207 h55 l-10 -8 m10 8 l-10 8"/><path d="M572 207 h55 l-10 -8 m10 8 l-10 8"/><path d="M867 207 h55 l-10 -8 m10 8 l-10 8"/></g>
<rect x="100" y="329" width="430" height="120" rx="12" fill="#e4f5ed" stroke="#26836d" stroke-width="2"/><rect x="670" y="329" width="430" height="120" rx="12" fill="#e7e4f8" stroke="#6f5cb5" stroke-width="2"/>
<g fill="#1b2d33"><text x="124" y="367" fill="#17685c" font-size="16" font-weight="700">PROTECTIVE ORDER</text><text x="124" y="405" font-size="17">Stop trigger sets a limit, not a promised fill.</text><text x="124" y="431" font-size="15">Cancel the other OCO leg after the trigger.</text><text x="694" y="367" fill="#5f4a9c" font-size="16" font-weight="700">SIGNAL + STORAGE</text><text x="694" y="405" font-size="17">Gate repeated strategy signals.</text><text x="694" y="431" font-size="15">Write checked ticks in background batches.</text><text x="44" y="516" fill="#9f4d12" font-size="16" font-weight="700">A large gap can pass the stop-limit price and leave the order unfilled.</text></g></g></svg>