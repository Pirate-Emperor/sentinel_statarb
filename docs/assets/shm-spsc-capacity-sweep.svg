<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600">
<rect width="1200" height="600" fill="#101827"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72d9be">LOCK-FREE IPC / QUEUE CAPACITY EXPERIMENT</text>
<text x="40" y="89" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f3f6fb">Capacity sweep results are generated by CI</text>
<text x="40" y="121" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#aab8ce">Each setting uses separate producer and consumer processes, a warm-up, and sequence checks.</text>
<rect x="40" y="159" width="1120" height="72" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="190" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#64c8e6">Capacity 16</text><text x="300" y="190" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#f3f6fb">Waiting on current-run p50 / p99</text>
<rect x="40" y="245" width="1120" height="72" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="276" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b39cf4">Capacity 64</text><text x="300" y="276" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#f3f6fb">Waiting on current-run p50 / p99</text>
<rect x="40" y="331" width="1120" height="72" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="362" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#68dca7">Capacity 256</text><text x="300" y="362" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#f3f6fb">Waiting on current-run p50 / p99</text>
<rect x="40" y="417" width="1120" height="72" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="448" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#df9c47">Capacity 1024</text><text x="300" y="448" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#f3f6fb">Waiting on current-run p50 / p99</text>
<text x="40" y="545" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#c8d2e1">The lowest p50 is not automatically the best choice: also check p99, throughput, and lost-message checks.</text>
</svg>
