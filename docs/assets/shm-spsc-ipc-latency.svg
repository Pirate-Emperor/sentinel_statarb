<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
<rect width="1120" height="500" fill="#101827"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72d9be">LOCK-FREE IPC / SHARED-MEMORY SPSC RING</text>
<text x="40" y="89" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f3f6fb">Measured result will replace this placeholder</text>
<text x="40" y="121" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#aab8ce">Two native processes use the same memory mapping; the benchmark checks lock-free atomics.</text>
<rect x="40" y="157" width="1040" height="76" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="190" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#64c8e6">P50 / P95 / P99</text>
<text x="310" y="190" font-family="Arial,sans-serif" font-size="17" font-weight="400" fill="#f3f6fb">Current-run measurement not yet recorded</text>
<rect x="40" y="252" width="1040" height="78" rx="12" fill="#202c3d" stroke="#44546a" stroke-width="2"/>
<text x="60" y="284" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#72d9be">Target: p50 one-way handoff below 10 μs</text>
<text x="60" y="309" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#c8d2e1">The report and validation check decide whether this target is met.</text>
<text x="40" y="385" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#f3f6fb">This shared-memory path is measured separately from ZeroMQ sockets.</text>
<text x="40" y="442" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#aab8ce">Only claim sub-10 μs when the measured report confirms it on the target host.</text>
</svg>
