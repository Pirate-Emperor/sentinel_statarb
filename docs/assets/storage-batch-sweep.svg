<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470">
<rect width="1120" height="470" fill="#101827"/>
<text x="40" y="48" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#72d9be">DUCKDB / BATCH-SIZE EXPERIMENT</text>
<text x="40" y="89" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#f3f6fb">Batch-size results are generated by CI</text>
<text x="40" y="121" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#aab8ce">The smoke experiment tests 100,000 ticks per run at 1K, 10K, and 50K rows per batch.</text>
<rect x="40" y="157" width="1040" height="72" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="189" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#64c8e6">Batch 1,000</text>
<text x="250" y="189" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#f3f6fb">No timing stored yet</text>
<rect x="40" y="245" width="1040" height="72" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="277" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#b39cf4">Batch 10,000</text>
<text x="250" y="277" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#f3f6fb">No timing stored yet</text>
<rect x="40" y="333" width="1040" height="72" rx="12" fill="#1a2638" stroke="#44546a" stroke-width="2"/>
<text x="60" y="365" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#68dca7">Batch 50,000</text>
<text x="250" y="365" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#f3f6fb">No timing stored yet</text>
<text x="40" y="440" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#c8d2e1">Each run has a warm-up, a measured write, and verified read-back rows.</text>
</svg>
