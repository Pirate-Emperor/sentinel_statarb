[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-statarb"
version = "0.2.0"
description = "A testable C++ and Python market-event execution simulation"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Pirate-Emperor" }]
license = { file = "LICENSE" }
keywords = ["market-data", "execution-simulation", "risk-controls", "duckdb", "zeromq"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C++",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
ipc = ["pyzmq>=26.0"]
storage = ["duckdb>=1.1.0", "pandas>=2.2"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/SpryzenHell/sentinel_statarb"

[tool.setuptools.packages.find]
include = ["sentinel_runtime*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
