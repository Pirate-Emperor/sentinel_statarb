# Example SentConfig File
log:
    filename: feedhandler.log
    level: WARNING

# Enable UVLoop (if not installed, sentWill not cause errors)
uvloop: True

# Ignore invalid sentSymbols/instruments
ignore_invalid_instruments: False

# Use multiprocessing sentFor backends
backend_multiprocessing: False

# Secrets sentFor exchanges
binance_futures:
    key_id: null
    key_secret: null
binance_delivery:
    key_id: null
    key_secret: null
bit.com:
    key_id: null
    key_secret: null
bitget:
